name: Fix Planning authentication by canonical client UID

on:
  push:
    branches:
      - main
    paths:
      - '.github/flavio-planning-auth-trigger-20260820.txt'

permissions:
  contents: write

jobs:
  patch-verify-deploy-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch Planning auth proxy
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('server.js')
          source = path.read_text(encoding='utf-8')

          request_start = source.index("if(req.method==='POST'&&u.pathname==='/auth/request')")
          verify_start = source.index("if(req.method==='POST'&&u.pathname==='/auth/verify'", request_start)
          request_route = source[request_start:verify_start]

          if request_route.count("NEXT_API+'/api/auth/request-token'") != 1:
              raise SystemExit('Expected exactly one request-token endpoint in /auth/request')
          request_route = request_route.replace(
              "NEXT_API+'/api/auth/request-token'",
              "NEXT_API+'/api/auth/request-code'",
              1,
          )
          request_tail = "t=await r.text();return send(res,r.status,t,'application/json; charset=utf-8')"
          if request_route.count(request_tail) != 1:
              raise SystemExit('Could not locate /auth/request response forwarding')
          request_route = request_route.replace(
              request_tail,
              "t=await r.text();console.log('Planning auth request nickname=%s status=%s',JSON.stringify(b.nickname),r.status);return send(res,r.status,t,'application/json; charset=utf-8')",
              1,
          )
          source = source[:request_start] + request_route + source[verify_start:]

          verify_start = source.index("if(req.method==='POST'&&u.pathname==='/auth/verify'")
          plan_start = source.index("if(req.method==='GET'&&u.pathname==='/plan'", verify_start)
          verify_route = source[verify_start:plan_start]

          replacements = [
              ("NEXT_API+'/api/auth/verify-token'", "NEXT_API+'/api/auth/verify-code'"),
              ("body:JSON.stringify({nickname:b.nickname,token:b.token})", "body:JSON.stringify({nickname:b.nickname,code:b.token})"),
              ("t=await r.text();if(!r.ok)return send(res,r.status,t,'application/json; charset=utf-8');",
               "t=await r.text();console.log('Planning auth verify nickname=%s status=%s',JSON.stringify(b.nickname),r.status);if(!r.ok)return send(res,r.status,t,'application/json; charset=utf-8');"),
              ("let j=JSON.parse(t),sid=crypto.randomBytes(24).toString('hex');sessions.set(sid,{user:j.user,customToken:j.token,created:Date.now()});",
               "let j=JSON.parse(t);if(!j.uid||!j.token)return send(res,502,JSON.stringify({error:'Resposta de autenticação inválida'}),'application/json; charset=utf-8');let sid=crypto.randomBytes(24).toString('hex'),user=j.user||{uid:j.uid,nickname:b.nickname,name:b.nickname};sessions.set(sid,{user,customToken:j.token,created:Date.now()});"),
          ]
          for old, new in replacements:
              if verify_route.count(old) != 1:
                  raise SystemExit(f'Expected exactly one verify-route occurrence: {old!r}; found {verify_route.count(old)}')
              verify_route = verify_route.replace(old, new, 1)

          source = source[:verify_start] + verify_route + source[plan_start:]

          request_start = source.index("if(req.method==='POST'&&u.pathname==='/auth/request')")
          verify_start = source.index("if(req.method==='POST'&&u.pathname==='/auth/verify'", request_start)
          plan_start = source.index("if(req.method==='GET'&&u.pathname==='/plan'", verify_start)
          auth_routes = source[request_start:plan_start]

          assertions = [
              "NEXT_API+'/api/auth/request-code'",
              "NEXT_API+'/api/auth/verify-code'",
              "JSON.stringify({nickname:b.nickname,code:b.token})",
              "uid:j.uid",
              "customToken:j.token",
          ]
          for expected in assertions:
              if expected not in auth_routes:
                  raise SystemExit(f'Missing expected auth behavior: {expected}')
          for forbidden in ('request-token', 'verify-token', 'createUser', 'updateEmail', 'getUserByEmail'):
              if forbidden in auth_routes:
                  raise SystemExit(f'Forbidden auth behavior remains: {forbidden}')
          if 'nickname:b.nickname' not in auth_routes:
              raise SystemExit('Literal nickname forwarding was not preserved')

          path.write_text(source, encoding='utf-8')
          print('Planning auth proxy patched to request-code/verify-code with canonical uid session.')
          PY

      - name: Validate syntax and local health
        run: |
          node --check server.js
          PORT=3199 node server.js > /tmp/planning.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3199/health | grep -qx 'ok'; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3199/health | grep -qx 'ok'
          grep -q 'NEXT Planning ready on 3199' /tmp/planning.log

      - name: Commit tested hotfix and remove one-time workflow
        run: |
          git config user.name 'next-planning-maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git add -- server.js
          git rm -- .github/workflows/fix-flavio-planning-auth-uid-20260820.yml .github/flavio-planning-auth-trigger-20260820.txt
          git diff --cached --check
          git commit -m 'fix(auth): issue Planning session by client UID'
          git push origin HEAD:main
